
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>SSAFY인의 포트폴리오</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="fa-solid fa-user-circle me-2"></i> <span>John Doe님의 프로필 페이지</span>
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active mx-2" href="index.html">
                <i class="fa-solid fa-pen-to-square me-1"></i> 기본 정보 수정
            </a>
            <a class="nav-link mx-2" href="portfolio.html">
                <i class="fa-solid fa-chart-pie me-1"></i> 포트폴리오 수정
            </a>
        </div>
    </div>
  </nav>

    <div class="container content-box-custom p-5 mb-5">
      <div class="portfolio-header">
        <h2>기본 정보 수정</h2>
      </div>
      
      <main class="profile-grid">
          <section class="left-section">
              <h3>프로필 사진</h3>
              <img src="./image_1.png" alt="프로필 사진" class="profile-img">

              <h3>자기 소개</h3>
              <div class="bio-container">
                  <textarea>안녕하세요. 저는 부자가 되고 싶습니다.</textarea>
                  <button type="button" class="update-btn">Update</button>
              </div>
          </section>

          <section class="right-section">
              <div class="investment-item">
                  <h4>투자상품 선호도</h4>
                  <label><input type="checkbox"> 주식</label>
                  <label><input type="checkbox"> 채권</label>
                  <label><input type="checkbox" checked> 부동산</label>
                  <label><input type="checkbox" checked> 가상 화폐</label>
              </div>

              <div class="investment-item">
                  <h4>투자 스타일</h4>
                  <label><input type="radio" name="style"> 안정적</label>
                  <label><input type="radio" name="style"> 중립적</label>
                  <label><input type="radio" name="style" checked> 공격적</label>
              </div>

              <div class="investment-item">
                  <h4>관심 종목</h4>
                  <label><input type="checkbox"> 정보기술</label>
                  <label><input type="checkbox" checked> 소비재</label>
                  <label><input type="checkbox" checked> 금융</label>
              </div>
          </section>
      </main>

      <hr class="section-divider">
      <section class="member-info-section">
          <div class="info-group">
              <label>회원 번호</label>
              <input type="text" value="1" readonly class="readonly-input">
          </div>

          <div class="info-group">
              <label>ID</label>
              <input type="text" value="김싸피" readonly class="readonly-input">
          </div>

          <div class="info-group">
              <label>Email</label>
              <div class="input-with-btn">
                  <input type="email" placeholder="이메일을 설정해주세요">
                  <span class="domain-text">@example.com</span>
                  <button type="button" class="update-small-btn">Update</button>
              </div>
          </div>

          <div class="info-group">
              <label>Nickname</label>
              <div class="input-with-btn">
                  <input type="text" placeholder="닉네임을 설정해주세요">
                  <button type="button" class="update-small-btn">Update</button>
              </div>
          </div>

          <div class="info-group">
              <label>나이</label>
              <div class="input-with-btn">
                  <input type="number" placeholder="나이를 설정해주세요">
                  <button type="button" class="update-small-btn">Update</button>
              </div>
          </div>

          <div class="info-group">
                <label>자산과 연봉</label>
                <div class="flex-row">
                    <div class="input-icon-group input-with-btn">
                        <span class="icon">$</span>
                        <input type="number" placeholder="현재 자산을 입력해주세요">
                        <button type="button" class="update-small-btn">Update</button>
                    </div>
                    <div class="input-icon-group input-with-btn">
                        <span class="icon">$</span>
                        <input type="number" placeholder="연봉을 입력해주세요">
                        <button type="button" class="update-small-btn">Update</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
